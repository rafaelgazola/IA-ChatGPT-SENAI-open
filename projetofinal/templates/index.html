<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce | Gestão de Produtos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="container">
            <h1 class="logo">🛒 E-commerce</h1>
            <nav>
                <a href="#" data-view="list" class="active">Produtos</a>
                <a href="#" data-view="form">Cadastrar</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="view-list" class="view active">
            <h2>Produtos Cadastrados</h2>
            <div class="toolbar">
                <input type="text" id="busca" placeholder="Buscar produto..." oninput="renderProdutos()">
                <button id="btn-refresh" onclick="listarProdutos()">Atualizar</button>
            </div>
            <div id="produtos-container" class="grid"></div>
            <p id="vazio" class="empty" hidden>Nenhum produto encontrado.</p>
        </section>

        <section id="view-form" class="view">
            <h2 id="form-titulo">Cadastrar Produto</h2>
            <form id="produto-form">
                <input type="hidden" id="produto-id">
                <label for="nome">Nome</label>
                <input type="text" id="nome" required>

                <label for="valor">Valor (R$)</label>
                <input type="number" id="valor" step="0.01" min="0" required>

                <label for="categoria">Categoria</label>
                <input type="text" id="categoria">

                <label for="estoque">Estoque</label>
                <input type="number" id="estoque" min="0">

                <div class="form-actions">
                    <button type="submit" id="btn-salvar" class="btn primary">Salvar</button>
                    <button type="button" class="btn" id="btn-cancelar" onclick="resetarForm()">Cancelar</button>
                </div>
            </form>
        </section>
    </main>

    <div id="toast" class="toast" hidden></div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
